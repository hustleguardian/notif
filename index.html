<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cadence</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#0F1720;
    --card:#171F29;
    --card2:#1D2733;
    --line:rgba(255,255,255,0.08);
    --text:#EDEFF2;
    --muted:#8892A0;
    --teal:#3FBFAE;
    --amber:#F2A93B;
    --red:#E2574C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding-bottom:100px;
  }
  .wrap{max-width:520px; margin:0 auto; padding:24px 18px 0;}

  header{margin-bottom:18px;}
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:34px;
    line-height:1.05;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--muted); font-size:14px; margin:0;}

  .banner{
    margin-top:16px;
    padding:14px 16px;
    border-radius:14px;
    background:rgba(226,87,76,0.12);
    border:1px solid rgba(226,87,76,0.35);
    font-size:13.5px;
    line-height:1.5;
    display:none;
  }
  .banner.show{display:block;}
  .banner b{color:var(--red);}

  .notif-row{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    font-size:12.5px;
    color:var(--muted);
  }
  .notif-row button{
    background:none; border:1px solid var(--line); color:var(--text);
    padding:6px 10px; border-radius:8px; font-size:12px; font-family:inherit; cursor:pointer;
  }
  .notif-row button:active{transform:scale(0.97);}
  .notif-row .on{color:var(--teal); border-color:rgba(63,191,174,0.4);}

  .list{margin-top:20px; display:flex; flex-direction:column; gap:12px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .dial{flex-shrink:0; width:56px; height:56px; position:relative;}
  .dial svg{transform:rotate(-90deg);}
  .dial .count{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace; font-weight:700; font-size:14px;
  }

  .info{flex:1; min-width:0;}
  .name{font-size:16px; font-weight:600; margin:0 0 2px;}
  .freq{
    font-family:'Space Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    display:flex; align-items:center; gap:6px;
  }
  .tag{
    display:inline-block; padding:2px 7px; border-radius:6px; font-size:10px;
    font-family:'Space Mono', monospace; letter-spacing:.03em; margin-top:6px;
  }
  .tag.green{background:rgba(63,191,174,0.15); color:var(--teal);}
  .tag.amber{background:rgba(242,169,59,0.15); color:var(--amber);}
  .tag.red{background:rgba(226,87,76,0.15); color:var(--red);}
  .tag.grey{background:rgba(255,255,255,0.08); color:var(--muted);}
  .card.ended{opacity:0.55;}
  .name{cursor:pointer;}

  .seg{display:flex; background:var(--card2); border-radius:10px; padding:3px; gap:3px;}
  .seg button{
    flex:1; background:none; border:none; color:var(--muted); font-family:inherit;
    font-size:13px; padding:9px 8px; border-radius:8px; cursor:pointer;
  }
  .seg button.active{background:var(--teal); color:#08201C; font-weight:600;}

  .actions{display:flex; flex-direction:column; gap:6px; flex-shrink:0;}
  .check-row{display:flex; gap:6px;}
  .btn-check{
    background:var(--teal); color:#08201C; border:none; border-radius:10px;
    padding:9px 12px; font-family:inherit; font-weight:600; font-size:12px; cursor:pointer;
  }
  .btn-check:active{transform:scale(0.96);}
  .btn-check.done{background:var(--card2); color:var(--muted);}
  .btn-date{
    background:none; border:1px solid var(--line); color:var(--text); border-radius:10px;
    padding:9px 10px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .btn-date:active{transform:scale(0.96);}
  .btn-del{
    background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; font-family:inherit;
  }

  .date-options{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .date-options button{
    background:var(--card2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px; font-family:inherit; font-size:14px; text-align:left; cursor:pointer;
  }
  .date-options button:active{transform:scale(0.98);}
  .date-custom{display:flex; gap:10px; align-items:flex-end;}
  .date-custom .field{flex:1; margin-bottom:0;}
  .date-custom button{
    border:none; border-radius:12px; padding:12px 16px; font-weight:600; font-size:14px;
    font-family:inherit; cursor:pointer; background:var(--teal); color:#08201C;
  }

  .empty{
    text-align:center; padding:60px 20px; color:var(--muted);
  }
  .empty .glyph{font-family:'Fraunces', serif; font-size:40px; color:var(--card2); margin-bottom:8px;}

  .fab{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    width:calc(100% - 36px); max-width:484px;
    background:var(--teal); color:#08201C;
    border:none; border-radius:16px; padding:16px;
    font-family:'Inter', sans-serif; font-weight:600; font-size:15px;
    cursor:pointer; box-shadow:0 8px 24px rgba(63,191,174,0.25);
  }

  .toast{
    position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(20px);
    background:var(--teal); color:#08201C; padding:10px 18px; border-radius:12px;
    font-family:'Inter', sans-serif; font-weight:600; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:30; box-shadow:0 8px 24px rgba(63,191,174,0.25); white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .fab:active{transform:translateX(-50%) scale(0.98);}

  .sheet-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none;
    align-items:flex-end; z-index:20;
  }
  .sheet-bg.show{display:flex;}
  .sheet{
    background:var(--card); width:100%; border-radius:22px 22px 0 0;
    padding:22px 20px 28px; max-width:520px; margin:0 auto;
  }
  .sheet h2{font-family:'Fraunces', serif; font-size:22px; margin:0 0 16px; font-weight:600;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-family:'Space Mono', monospace; letter-spacing:.03em;}
  .field input, .field select{
    width:100%; background:var(--card2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px; font-size:15px; font-family:inherit;
  }
  .freq-row{display:flex; gap:10px;}
  .freq-row .field{flex:1;}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .sheet-actions button{
    flex:1; border:none; border-radius:12px; padding:13px; font-weight:600; font-size:14px; font-family:inherit; cursor:pointer;
  }
  .cancel{background:var(--card2); color:var(--text);}
  .save{background:var(--teal); color:#08201C;}

  .test-panel{
    margin-top:24px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 16px;
    color:var(--muted);
  }
  .test-panel summary{
    cursor:pointer;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text);
  }
  .test-panel .field{margin-top:12px; margin-bottom:0;}
  .test-panel-actions{
    display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;
  }
  .test-panel-actions span{font-size:12px;}
  .test-panel-actions button{
    background:none; border:1px solid var(--line); color:var(--text);
    padding:6px 10px; border-radius:8px; font-size:12px; font-family:inherit; cursor:pointer;
  }

  ::selection{background:rgba(63,191,174,0.3);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Cadence</div>
    <h1>Tes rituels</h1>
    <p class="sub">Ce que tu veux faire, et à quel rythme.</p>
    <div class="banner" id="banner"></div>
    <div class="notif-row">
      <span id="notifLabel">Notifications désactivées</span>
      <button id="notifBtn">Activer</button>
    </div>
    <div class="notif-row">
      <span>Sauvegarde de tes données</span>
      <span>
        <button id="exportBtn">Exporter</button>
        <button id="importBtn">Importer</button>
      </span>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
  </header>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none;">
    <div class="glyph">◐</div>
    <div>Aucun rituel pour l'instant.<br>Ajoute la première activité à suivre.</div>
  </div>
  <details class="test-panel" id="testPanel">
    <summary>Mode test</summary>
    <div class="field">
      <label>Date simulée</label>
      <input id="fakeNowInput" type="datetime-local">
    </div>
    <div class="test-panel-actions">
      <span id="fakeNowStatus">Date réelle</span>
      <button type="button" id="resetFakeNowBtn">Réinitialiser</button>
    </div>
  </details>
</div>

<button class="fab" id="addBtn">+ Ajouter une activité</button>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h2 id="sheetTitle">Nouvelle activité</h2>
    <div class="field">
      <label>Nom</label>
      <input id="fName" placeholder="ex. Muscu, Don de plasma, Lecture...">
    </div>
    <div class="freq-row">
      <div class="field">
        <label>Tous les</label>
        <input id="fIntervalCount" type="number" min="1" value="1">
      </div>
      <div class="field">
        <label>Unité</label>
        <select id="fIntervalUnit">
          <option value="day">Jour(s)</option>
          <option value="week">Semaine(s)</option>
          <option value="month">Mois</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Durée</label>
      <div class="seg">
        <button type="button" id="segPermanent" class="active">Tout le temps</button>
        <button type="button" id="segLimited">Jusqu'à une date</button>
      </div>
    </div>
    <div class="field" id="endDateField" style="display:none;">
      <label>Fin</label>
      <input id="fEndDate" type="date">
    </div>
    <div class="sheet-actions">
      <button class="cancel" id="cancelBtn">Annuler</button>
      <button class="save" id="saveBtn">Enregistrer</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="dateSheetBg">
  <div class="sheet">
    <h2>C'était quand ?</h2>
    <div class="date-options">
      <button type="button" data-days-ago="0">Aujourd'hui</button>
      <button type="button" data-days-ago="1">Hier</button>
      <button type="button" data-days-ago="2">Avant-hier</button>
    </div>
    <div class="field">
      <label>Ou une autre date</label>
      <div class="date-custom">
        <input id="backdateInput" type="date">
        <button type="button" id="backdateValidateBtn">Valider</button>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="cancel" id="dateSheetCancelBtn">Annuler</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="logic.js"></script>
<script>
let activities = [];
let editingId = null;
let fakeNow = null;

function uid(){ return 'a_' + Date.now() + '_' + Math.floor(Math.random()*10000); }

function appNow(){ return CadenceLogic.getNow(fakeNow); }

async function loadFakeNow(){
  try{
    if(hasCloudStorage){
      const res = await window.storage.get('fakeNow', false);
      return res ? res.value : null;
    } else {
      return localStorage.getItem('cadence_fake_now');
    }
  }catch(e){
    return null;
  }
}

async function saveFakeNow(iso){
  try{
    if(hasCloudStorage){
      await window.storage.set('fakeNow', iso || '', false);
    } else {
      if(iso) localStorage.setItem('cadence_fake_now', iso);
      else localStorage.removeItem('cadence_fake_now');
    }
  }catch(e){
    console.error('Erreur de sauvegarde', e);
  }
}

async function loadCheckpointState(){
  try{
    if(hasCloudStorage){
      const res = await window.storage.get('notifCheckpoints', false);
      return res ? JSON.parse(res.value) : null;
    } else {
      const raw = localStorage.getItem('cadence_notif_checkpoints');
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){
    return null;
  }
}

async function saveCheckpointState(state){
  try{
    if(hasCloudStorage){
      await window.storage.set('notifCheckpoints', JSON.stringify(state), false);
    } else {
      localStorage.setItem('cadence_notif_checkpoints', JSON.stringify(state));
    }
  }catch(e){
    console.error('Erreur de sauvegarde', e);
  }
}

function toDatetimeLocalValue(date){
  const pad = n => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function refreshFakeNowUI(){
  const input = document.getElementById('fakeNowInput');
  const status = document.getElementById('fakeNowStatus');
  const panel = document.getElementById('testPanel');
  const summary = panel.querySelector('summary');
  if(fakeNow){
    input.value = toDatetimeLocalValue(new Date(fakeNow));
    status.textContent = 'Date simulée : ' + new Date(fakeNow).toLocaleString('fr-FR');
    panel.open = true;
    summary.textContent = 'Mode test — date simulée active';
  } else {
    input.value = '';
    status.textContent = 'Date réelle';
    summary.textContent = 'Mode test';
  }
}

const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

async function loadData(){
  fakeNow = await loadFakeNow();
  try{
    if(hasCloudStorage){
      const res = await window.storage.get('activities', false);
      activities = res ? JSON.parse(res.value) : [];
    } else {
      const raw = localStorage.getItem('cadence_activities');
      activities = raw ? JSON.parse(raw) : [];
    }
  }catch(e){
    activities = [];
  }
  const nowIso = appNow().toISOString();
  const migrated = activities.map(act => CadenceLogic.migrateActivity(act, nowIso));
  const didMigrate = migrated.some((act, i) => act !== activities[i]);
  activities = migrated;
  if(didMigrate) await saveData();
  refreshFakeNowUI();
  render();
}

async function saveData(){
  try{
    if(hasCloudStorage){
      await window.storage.set('activities', JSON.stringify(activities), false);
    } else {
      localStorage.setItem('cadence_activities', JSON.stringify(activities));
    }
  }catch(e){
    console.error('Erreur de sauvegarde', e);
  }
}

const evalActivity = CadenceLogic.evalActivity;

function colorFor(status){
  if(status === 'green') return '#3FBFAE';
  if(status === 'red') return '#E2574C';
  if(status === 'ended') return '#8892A0';
  return '#F2A93B';
}

function dialSVG(pct, color){
  const r = 22, c = 2*Math.PI*r;
  const offset = c - Math.min(pct,1)*c;
  return `<svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="#232E3A" stroke-width="5"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="5"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

function render(){
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const banner = document.getElementById('banner');

  if(activities.length === 0){
    list.innerHTML = '';
    empty.style.display = 'block';
    banner.classList.remove('show');
    return;
  }
  empty.style.display = 'none';

  const now = appNow();
  const overdue = [];
  const sorted = [...activities].sort((a,b) => {
    const ea = evalActivity(a, now).status === 'ended' ? 1 : 0;
    const eb = evalActivity(b, now).status === 'ended' ? 1 : 0;
    return ea - eb;
  });

  list.innerHTML = sorted.map(act => {
    const st = evalActivity(act, now);
    const color = colorFor(st.status);
    const outstanding = CadenceLogic.isOutstanding(act, now);
    const freqLabel = CadenceLogic.formatFrequency(act.intervalCount, act.intervalUnit);
    const labels = {green:'à jour', red:'urgent', amber:'à faire', ended:'terminé'};
    const tagClass = st.status === 'ended' ? 'grey' : st.status;
    if(st.status === 'red') overdue.push(act.name);

    let freqLine;
    if(st.status === 'ended'){
      const endStr = new Date(act.endDate + 'T00:00:00').toLocaleDateString('fr-FR');
      freqLine = `${freqLabel} · terminé le ${endStr}`;
    } else if(act.endDate){
      const endStr = new Date(act.endDate + 'T00:00:00').toLocaleDateString('fr-FR');
      freqLine = `${freqLabel} · jusqu'au ${endStr}`;
    } else if(st.status === 'red'){
      freqLine = st.daysLate === 0 ? `${freqLabel} · en retard aujourd'hui` : `${freqLabel} · en retard de ${st.daysLate}j`;
    } else {
      freqLine = st.daysLeft === 0 ? `${freqLabel} · prochain aujourd'hui` : `${freqLabel} · prochain dans ${st.daysLeft}j`;
    }

    const dialCenter = st.status === 'ended' ? '✓'
      : st.status === 'red' ? (st.daysLate === 0 ? 'Auj.' : st.daysLate + 'j')
      : (st.daysLeft === 0 ? 'Auj.' : st.daysLeft + 'j');

    return `
      <div class="card ${st.status === 'ended' ? 'ended' : ''}">
        <div class="dial">${dialSVG(st.status === 'ended' ? 1 : st.pct, color)}
          <div class="count">${dialCenter}</div>
        </div>
        <div class="info">
          <p class="name" onclick="openEdit('${act.id}')">${escapeHtml(act.name)}</p>
          <div class="freq">${freqLine}</div>
          <span class="tag ${tagClass}">${labels[st.status]}</span>
        </div>
        <div class="actions">
          ${st.status === 'ended' ? '' : `
          <div class="check-row">
            <button class="btn-check ${outstanding ? '' : 'done'}" onclick="markDone('${act.id}')">Fait ✓</button>
            <button class="btn-date" onclick="openDateSheet('${act.id}')" title="Choisir une date">📅</button>
          </div>`}
          ${act.completions.length > 0 ? `<button class="btn-del" onclick="removeLastCompletion('${act.id}')">Annuler</button>` : ''}
          <button class="btn-del" onclick="removeActivity('${act.id}')">Supprimer</button>
        </div>
      </div>
    `;
  }).join('');

  if(overdue.length > 0){
    banner.classList.add('show');
    banner.innerHTML = `<b>En retard :</b> ${overdue.map(escapeHtml).join(', ')}. Marque-les si c'est fait, ou prends rendez-vous.`;
  } else {
    banner.classList.remove('show');
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let toastTimer = null;
function showToast(message){
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

async function markDone(id){
  const act = activities.find(a => a.id === id);
  if(!act) return;
  act.completions.push(appNow().toISOString());
  await saveData();
  render();
  showToast(`${act.name} — marqué comme fait ✓`);
}

async function removeLastCompletion(id){
  const act = activities.find(a => a.id === id);
  if(!act || act.completions.length === 0) return;
  act.completions.pop();
  await saveData();
  render();
  showToast(`${act.name} — dernier "fait" annulé`);
}

let dateSheetActivityId = null;
const dateSheetBg = document.getElementById('dateSheetBg');
const backdateInput = document.getElementById('backdateInput');

function openDateSheet(id){
  dateSheetActivityId = id;
  backdateInput.value = '';
  dateSheetBg.classList.add('show');
}

function closeDateSheet(){
  dateSheetBg.classList.remove('show');
  dateSheetActivityId = null;
}

async function commitBackdate(dateStr){
  const act = activities.find(a => a.id === dateSheetActivityId);
  closeDateSheet();
  if(!act || !dateStr) return;
  act.completions.push(CadenceLogic.completionIsoForDateStr(dateStr));
  await saveData();
  render();
  const dateLabel = new Date(dateStr + 'T00:00:00').toLocaleDateString('fr-FR');
  showToast(`${act.name} — marqué comme fait le ${dateLabel} ✓`);
}

document.querySelectorAll('.date-options button[data-days-ago]').forEach(btn => {
  btn.onclick = () => {
    const daysAgo = parseInt(btn.dataset.daysAgo, 10);
    commitBackdate(CadenceLogic.dateStrDaysAgo(appNow(), daysAgo));
  };
});

document.getElementById('backdateValidateBtn').onclick = () => commitBackdate(backdateInput.value);
document.getElementById('dateSheetCancelBtn').onclick = () => closeDateSheet();
dateSheetBg.onclick = (e) => { if(e.target === dateSheetBg) closeDateSheet(); };

async function removeActivity(id){
  activities = activities.filter(a => a.id !== id);
  await saveData();
  render();
}

// Sheet handling
const sheetBg = document.getElementById('sheetBg');
const segPermanent = document.getElementById('segPermanent');
const segLimited = document.getElementById('segLimited');
const endDateField = document.getElementById('endDateField');
const fEndDate = document.getElementById('fEndDate');

function setDurationMode(limited){
  segPermanent.classList.toggle('active', !limited);
  segLimited.classList.toggle('active', limited);
  endDateField.style.display = limited ? 'block' : 'none';
}
segPermanent.onclick = () => setDurationMode(false);
segLimited.onclick = () => setDurationMode(true);

document.getElementById('addBtn').onclick = () => {
  editingId = null;
  document.getElementById('sheetTitle').textContent = 'Nouvelle activité';
  document.getElementById('fName').value = '';
  document.getElementById('fIntervalCount').value = 1;
  document.getElementById('fIntervalUnit').value = 'week';
  fEndDate.value = '';
  setDurationMode(false);
  sheetBg.classList.add('show');
};

function openEdit(id){
  const act = activities.find(a => a.id === id);
  if(!act) return;
  editingId = id;
  document.getElementById('sheetTitle').textContent = 'Modifier l\'activité';
  document.getElementById('fName').value = act.name;
  document.getElementById('fIntervalCount').value = act.intervalCount;
  document.getElementById('fIntervalUnit').value = act.intervalUnit;
  if(act.endDate){
    setDurationMode(true);
    fEndDate.value = act.endDate;
  } else {
    setDurationMode(false);
    fEndDate.value = '';
  }
  sheetBg.classList.add('show');
}

document.getElementById('cancelBtn').onclick = () => sheetBg.classList.remove('show');
sheetBg.onclick = (e) => { if(e.target === sheetBg) sheetBg.classList.remove('show'); };

document.getElementById('saveBtn').onclick = async () => {
  const name = document.getElementById('fName').value.trim();
  const intervalCount = Math.min(999, Math.max(1, parseInt(document.getElementById('fIntervalCount').value, 10) || 1));
  const intervalUnit = document.getElementById('fIntervalUnit').value;
  const limited = segLimited.classList.contains('active');
  const endDate = limited ? fEndDate.value : null;
  if(!name) return;
  if(limited && !endDate) return;

  if(editingId){
    const act = activities.find(a => a.id === editingId);
    if(act){
      act.name = name; act.intervalCount = intervalCount; act.intervalUnit = intervalUnit; act.endDate = endDate;
    }
  } else {
    activities.push({
      id: uid(), name, intervalCount, intervalUnit, endDate,
      createdAt: appNow().toISOString(),
      completions: [],
    });
  }
  await saveData();
  sheetBg.classList.remove('show');
  render();
};

// Notifications
const notifBtn = document.getElementById('notifBtn');
const notifLabel = document.getElementById('notifLabel');

let swRegistration = null;
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => { swRegistration = reg; }).catch(() => {});
}

// Chrome on Android refuses `new Notification()` ("Illegal constructor") and
// requires going through a Service Worker's showNotification() instead.
// This helper prefers that path whenever a service worker is available
// (desktop and Android alike) and falls back to the constructor otherwise
// (e.g. file:// pages, where service workers can't register at all).
async function notify(title, options){
  if(swRegistration){
    await swRegistration.showNotification(title, options);
    return;
  }
  if('serviceWorker' in navigator){
    try{
      // navigator.serviceWorker.ready never settles when no service worker can
      // ever activate for this page (e.g. file://), so race it against a
      // short timeout instead of awaiting it unconditionally.
      const reg = await Promise.race([
        navigator.serviceWorker.ready,
        new Promise((_, reject) => setTimeout(() => reject(new Error('service worker not ready')), 1000)),
      ]);
      await reg.showNotification(title, options);
      return;
    }catch(e){
      // fall through to the constructor below
    }
  }
  new Notification(title, options);
}

function refreshNotifUI(){
  if(!('Notification' in window)){
    notifLabel.textContent = 'Notifications non supportées par ce navigateur';
    notifBtn.style.display = 'none';
    return;
  }
  if(Notification.permission === 'granted'){
    notifLabel.textContent = 'Notifications activées';
    notifLabel.classList.add('on');
    notifBtn.textContent = 'Tester';
  } else if(Notification.permission === 'denied'){
    notifLabel.textContent = 'Bloquées — à débloquer dans les réglages du site';
    notifLabel.classList.remove('on');
    notifBtn.textContent = 'Comment faire ?';
  } else {
    notifLabel.textContent = 'Notifications désactivées';
    notifLabel.classList.remove('on');
    notifBtn.textContent = 'Activer';
  }
}

notifBtn.onclick = async () => {
  if(!('Notification' in window)){
    alert("Ce navigateur ne supporte pas les notifications web. Essaie avec Chrome à jour.");
    return;
  }

  if(Notification.permission === 'denied'){
    alert("Les notifications sont bloquées pour cette page.\n\nSur Chrome Android : appuie sur les ⋮ en haut à droite → Infos sur le site (ou l'icône ⓘ / cadenas à côté de l'adresse) → Autorisations → Notifications → Autoriser.\n\nPuis reviens ici et réessaie.");
    return;
  }

  if(Notification.permission === 'granted'){
    try{
      const digest = CadenceLogic.buildDigest(activities, appNow());
      const { title, body } = CadenceLogic.formatDigestNotification(digest);
      await notify(title, {
        body: body || 'Ceci est un test — si tu vois ça, les notifications marchent. Rien à signaler pour le moment.',
      });
    }catch(e){
      alert("La permission est accordée mais l'envoi a échoué : " + e.message);
    }
    return;
  }

  try{
    const perm = await Notification.requestPermission();
    refreshNotifUI();
    if(perm === 'granted'){
      await notify('Cadence', { body: 'Notifications activées ✓' });
      checkAndNotify();
    } else if(perm === 'denied'){
      alert("Tu as refusé la permission. Tu peux la réactiver dans les réglages du site (icône ⓘ à côté de l'adresse → Autorisations → Notifications).");
    }
  }catch(e){
    alert("Erreur lors de la demande de permission : " + e.message + "\n\nSi tu as ouvert ce fichier directement (adresse commençant par file://), certains navigateurs Android bloquent les notifications sur ce type de page. Essaie de l'ouvrir depuis un lien https:// à la place.");
  }
};

// Fires the most recent unfired daily checkpoint (9h/12h/17h) at most once per
// day each, with catch-up if the app wasn't open at the exact time — see
// CadenceLogic.nextCheckpointToFire. Safe to call often; it's a no-op outside
// a checkpoint window or once today's applicable checkpoint already fired.
async function checkAndNotify(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = appNow();
  const state = await loadCheckpointState();
  const { checkpointId, newState } = CadenceLogic.nextCheckpointToFire(now, state);
  await saveCheckpointState(newState);
  if(!checkpointId) return;
  const digest = CadenceLogic.buildDigest(activities, now);
  const { title, body } = CadenceLogic.formatDigestNotification(digest);
  if(!body) return;
  notify(title, { body }).catch(() => {});
}

document.getElementById('fakeNowInput').onchange = async (e) => {
  const val = e.target.value;
  fakeNow = val ? new Date(val).toISOString() : null;
  await saveFakeNow(fakeNow);
  refreshFakeNowUI();
  render();
  checkAndNotify();
};

document.getElementById('resetFakeNowBtn').onclick = async () => {
  fakeNow = null;
  await saveFakeNow(null);
  refreshFakeNowUI();
  render();
};

// Export / import (backup & restore)
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(activities, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cadence-backup-${appNow().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

const importFileInput = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => importFileInput.click();

importFileInput.onchange = async (e) => {
  const file = e.target.files[0];
  importFileInput.value = '';
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!Array.isArray(parsed)) throw new Error('Format invalide — ce n\'est pas une sauvegarde Cadence.');
    const confirmMsg = activities.length > 0
      ? `Ça va remplacer tes ${activities.length} activité(s) actuelle(s) par les ${parsed.length} du fichier. Continuer ?`
      : `Importer ${parsed.length} activité(s) ?`;
    if(!confirm(confirmMsg)) return;
    const nowIso = appNow().toISOString();
    activities = parsed.map(act => CadenceLogic.migrateActivity(act, nowIso));
    await saveData();
    render();
    showToast(`${activities.length} activité(s) importée(s) ✓`);
  }catch(err){
    alert("Le fichier n'a pas pu être importé : " + err.message);
  }
};

// Check on load (catches up any checkpoint missed while the app was closed),
// then every 5 min while the app stays open so an open checkpoint fires close
// to on-time instead of only at the next visit.
loadData().then(() => { refreshNotifUI(); checkAndNotify(); });
setInterval(checkAndNotify, 5*60*1000);
</script>
</body>
</html>
